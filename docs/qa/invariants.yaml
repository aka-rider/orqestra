# Canaries: each proves a confirmed defect (§4) is still live. A canary with a
# canary_test is RUN by `make qa-verify` and must pass; gate_test names the real
# gate that should replace it once the bug is fixed.
#
# DEFECT-01 (channel never closes) and DEFECT-05 (session id never set) were FIXED
# by the harness refactor; their canaries were retired and INV-H1-CLOSE /
# INV-H2-SESSIONID are now covered by TestHarnessRun_TerminatesWhenProcessExits.
# All confirmed defects have been fixed; no canary is currently live.
#   DEFECT-02 (empty validation → VerdictPass)         fixed 2026-06-21 → INV-P3-VALID covered
#   DEFECT-03 (worktree create failure silent fallback) fixed 2026-06-22 → INV-P3-DEGRADE covered
#   DEFECT-04 (worktree commit failure left Success)    fixed by harness refactor
#   DEFECT-01/05 (channel/session id)                   fixed by harness refactor
# Gates: TestParseValidationOutput, TestExecuteStep_WorktreeFailure_EmitsEvent.
canaries: []
