  # INV-O1-FLOW is the ROUTER invariant only: auto-approve drives phases without
  # blocking and cancellation propagates. It is legitimately covered by the engine
  # tests, which use fakeStep/noopStepContext stand-ins — so it is NOT real_wiring
  # and must never claim the real pipeline works. Per-agent real wiring lives in the
  # INV-ROLE-* invariants below (enforced by checkRoleCoverage + checkRealWiring).
  - id: INV-O1-FLOW
    pillar: P6
    layer: L1
    status: covered
    anchors:
      - {file: internal/orchestrator/events.go, symbol: AutoApprove}
    tests:
