      - TestEngine_PhaseOrder
      - TestEngine_ValidationFailureDetection
      - TestEngine_ValidationSuccessDetection
      - TestNoDeadKnob_GateAfterDeliberation_FiresWhenEnabled

  # ── Per-agent capability gates (INV-ROLE-*) ───────────────────────────────────
  # Every pipeline agent owns a covered + real_wiring invariant: a fast, isolated
  # test that exercises the agent's REAL capability against real machinery (seatbelt
  # sandbox, real git/worktree, a real harness.Run subprocess via the replay stub,
  # or a real parser on real input) — never a fake step or no-op executor.
  # checkRoleCoverage requires one per role; checkRealWiring forbids satisfying them
  # with a fake. A break in any single agent lights up exactly one gate in seconds,
  # without running the full pipeline.

  - id: INV-ROLE-RESEARCH
    pillar: P6
    layer: L1
    status: covered
    role: researcher
    real_wiring: true
    anchors:
