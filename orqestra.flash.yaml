# Orqestra — Fast REPL Config (Gemini 3.1 Flash via copilot-proxy)
# Usage: orqestra --config flash
#
# Ultra-fast iteration for quick checks, small tasks, and experiments.
# Uses Gemini 3.1 Flash (preview) for every tier — cheap and snappy.

providers:
  copilot-proxy:
    base_url: http://127.0.0.1:4141
    api_key: dummy
    type: openai

models:
  large:
    provider: copilot-proxy
    model: gemini-3.1-flash

  small:
    provider: copilot-proxy
    model: gemini-3.1-flash

seatbelt:
  max_lifetime: 20m

retry:
  planner_attempts: 1
  plan_validation_repair: 1
  work_validation_repair: 1

worker:
  timeout: 15m
