# Orqestra — Fast REPL Config (Gemini 3.1 Flash via copilot-proxy)
# Usage: orqestra --config flash
#
# Ultra-fast iteration for quick checks, small tasks, and experiments.
# Uses Gemini 3.1 Flash (preview) for every role — cheap and snappy.

providers:
  copilot-proxy:
    base_url: http://127.0.0.1:4141
    api_key: dummy
    type: openai

models:
  flash:
    provider: copilot-proxy
    model: gemini-3.1-flash

researcher:
  model: flash

planner:
  model: flash

worker:
  model: flash

utility: flash

sandbox:
  max_lifetime: 20m

retry:
  researcher_attempts: 1
  planner_attempts: 1
  worker_validation_retries: 1

worker:
  timeout: 15m
