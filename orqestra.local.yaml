# Orqestra — Local Development Config (all qwen3.6 via llama-cpp)
# Usage: orqestra --config local
#
# Fully offline. All models run on the local llama-server instance.
# Suitable for development iterations and E2E testing of Orqestra itself.

providers:
  llama-cpp:
    base_url: http://192.168.50.212:11434

models:
  large:
    provider: llama-cpp
    model: qwen3.6

  medium:
    provider: llama-cpp
    model: qwen3.6

  small:
    provider: llama-cpp
    model: qwen3.6

researcher:
  model: medium
  mcp_servers: [MCP_DOCKER]

architect:
  model: large
  mcp_servers: [MCP_DOCKER]

worker:
  model: medium
  timeout: 30m
  parallelism: 0
  mcp_servers: [MCP_DOCKER]

sandbox:
  max_lifetime: 35m
  extra_env:
    DISABLE_NON_ESSENTIAL_MODEL_CALLS: "1"
    CLAUDE_CODE_ATTRIBUTION_HEADER: "0"
