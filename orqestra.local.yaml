# Orqestra — Local Development Config (all qwen3.6 via llama-cpp)
# Usage: orqestra --config local
#
# Fully offline. All models run on the local llama-server instance.
# Suitable for development iterations and E2E testing of Orqestra itself.

providers:
  llama-cpp:
    base_url: http://192.168.50.212:11434
    api_key: dummy
    type: openai

models:
  large:
    provider: llama-cpp
    model: qwen3.6

  small:
    provider: llama-cpp
    model: qwen3.6

sandbox:
  max_lifetime: 35m

worker:
  timeout: 30m
