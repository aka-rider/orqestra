# Orqestra — Local Development Config (all qwen3.6 via llama-cpp)
# Usage: orqestra --config local
#
# Fully offline. All models run on the local llama-server instance.
# Suitable for development iterations and E2E testing of Orqestra itself.

providers:
  llama-cpp:
    base_url: http://192.168.50.212:11434
    type: openai

models:
  large:
    provider: llama-cpp
    model: qwen3.6

  small:
    provider: llama-cpp
    model: qwen3.6

sandbox:
  max_lifetime: 35m
  extra_env:
    DISABLE_NON_ESSENTIAL_MODEL_CALLS: "0"
    CLAUDE_CODE_ATTRIBUTION_HEADER: "0"
    ANTHROPIC_SMALL_FAST_MODEL: "qwen3.6"

worker:
  timeout: 30m
  parallelism: 0

gateway:
  mcp_servers: []

planner:
  mcp_servers:
    - MCP_DOCKER
